[project]
name = "smogwatch"
version = "0.1.0"
description = "Hourly air-quality data pipeline for Pakistan: Prefect + AWS S3 + geohash catalogs + DuckDB"
readme = "README.md"
license = "MIT"
authors = [{ name = "Syed Ashher Majid" }]
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added phase by phase, as each component is built.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "poethepoet>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smogwatch"]

# ---------------------------------------------------------------- task runner
# Usage: `uv run poe <task>`  (works on Windows and Linux)
[tool.poe.tasks]
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "mypy src"
test = "pytest"
check = ["lint", "fmt-check", "typecheck", "test"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import order)
    "B",        # bugbear (likely bugs)
    "UP",       # pyupgrade (modern syntax)
    "SIM",      # simplify
    "N",        # naming
    "S",        # bandit (security)
    "PTH",      # use pathlib
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=smogwatch --cov-report=term-missing"
markers = [
    "integration: tests that need S3 (MinIO/moto)",
]

[tool.coverage.run]
source = ["smogwatch"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
